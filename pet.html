<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>爱宠知识</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .outer-box {
            width: 370px;
            height: 550px;
            border-radius: 15px;
            background-color: #8ec549;
            background-image: radial-gradient(#a8d86b 2px, transparent 2px);
            background-size: 15px 15px;
            box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.3);
            padding: 20px 10px;
        }
        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
            border-left: 4px solid #bebe2c;
            padding-left: 10px;
            line-height: 1;
            margin-bottom: 22px;
        }
        .inner-box {
            width: 350px;
            height: 460px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            margin: 0 auto;
            padding: 15px 15px; 
        }
        .news-list {
            list-style: none;
        }
        .news-list li {
            height: 48px;
            line-height: 48px;
            border-bottom: 1px dashed #ccc;
            background: url('./imag/tb.gif') no-repeat left center;
            background-size: 20px 20px; 
            padding-left: 32px;
        }
        .news-list li:last-child {
            border-bottom: none;
        }
        .news-list a {
            color: #333;
            text-decoration: none;
            font-size: 18px;
            display: block;
        }
        .news-list a:hover {
            font-weight: bold;
            color: #739311;
            text-shadow: 1px 1px 2px #bebe2c;
        }
    </style>
</head>
<body>
    <div class="outer-box">
        <h2 class="title">爱宠知识</h2>
        
        <div class="inner-box">
            <ul class="news-list">
                <li><a href="#">养狗比养猫对健康更有利</a></li>
                <li><a href="#">日本正宗柴犬亮相，你怎么看柴犬？</a></li>
                <li><a href="#">狗狗歌曲《新年旺旺》</a></li>
                <li><a href="#">带宠兜风，开车带宠需要注意什么？</a></li>
                <li><a href="#">【爆笑】这狗狗太不给力了！</a></li>
                <li><a href="#">狗狗与男童相同着装拍有爱造型照</a></li>
                <li><a href="#">狗狗各个阶段健康大事件</a></li>
                <li><a href="#">调皮宠物狗陷在沙发里的搞笑瞬间</a></li>
                <li><a href="#">为什么每次大小便后，会用脚踢土？</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
