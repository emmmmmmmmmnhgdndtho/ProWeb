    <main class="content-section">
        <h2 class="section-title">探索千年蜀都</h2>
        <div class="grid-container">
            <div class="item-card">
                <img src="imag/kuanzhai.jpeg" alt="宽窄巷子" class="item-img">
                <div class="item-info">
                    <h3>宽窄巷子</h3>
                    <p>由宽巷子、窄巷子和井巷子平行排列组成，这里保留了清朝古街道的建筑格局，是体验成都慢生活与盖碗茶文化的绝佳去处。</p>
                </div>
            </div>
            <div class="item-card">
                <img src="imag/wuhou.jpeg" alt="武侯祠" class="item-img">
                <div class="item-info">
                    <h3>武侯祠</h3>
                    <p>中国唯一的一座君臣合祀祠庙，纪念诸葛亮与刘备。红墙竹影是这里的标志性景观，也是感受三国文化的必去之地。</p>
                </div>
            </div>
            <div class="item-card">
                <img src="imag/jingli.jpeg" alt="锦里" class="item-img">
                <div class="item-info">
                    <h3>锦里古街</h3>
                    <p>紧邻武侯祠，以明末清初川西民居作外衣，三国文化与成都民俗作内涵，夜晚红灯笼亮起时，极具古风意境。</p>
                </div>
            </div>
        </div>
