<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>京东商品导购</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .guide-container {
            width: 740px;
            height: 620px;
            border-radius: 15px;
            background-color: #fff;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .item {
            width: 210px;
            height: 270px;
            border: 10px groove #9966cc;
            box-shadow: 5px 5px 10px #ccc;
            text-align: center;
            padding: 10px;
            transition: all 0.3s;
        }
        .item:hover {
            border-style: dashed;
            border-color: #9999cc;
            cursor: pointer;
        }
        .item h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            font-weight: normal;
        }
        .item .subtitle {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }
        .item .price {
            font-size: 18px;
            color: #e4393c;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="guide-container">
        <div class="item">
            <h3>麦包包 Vinhas单肩包</h3>
            <div class="subtitle">领券满减</div>
            <div class="price">￥128</div>
            <img src="./imag/image5-2-1.jpg" alt="麦包包">
        </div>
        <div class="item">
            <h3>优购.adidas休闲鞋</h3>
            <div class="subtitle">限时抢购</div>
            <div class="price">￥365</div>
            <img src="./imag/image5-2-2.jpg" alt="adidas">
        </div>
        <div class="item">
            <h3>优购.NB女子复古鞋</h3>
            <div class="subtitle">限时抢购</div>
            <div class="price">￥299</div>
            <img src="./imag/image5-2-3.jpg" alt="NB">
        </div>
        <div class="item">
            <h3>优购.VANS女子硫化鞋</h3>
            <div class="subtitle">限时抢购</div>
            <div class="price">￥280</div>
            <img src="./imag/image5-2-4.jpg" alt="VANS">
        </div>
        <div class="item">
            <h3>优购.匡威经典低帮鞋</h3>
            <div class="subtitle">限时抢购</div>
            <div class="price">￥199</div>
            <img src="./imag/image5-2-5.jpg" alt="匡威">
        </div>
        <div class="item">
            <h3>优购.Belle羊皮女鞋</h3>
            <div class="subtitle">限时抢购</div>
            <div class="price">￥398</div>
            <img src="./imag/image5-2-6.jpg" alt="Belle">
        </div>
    </div>
</body>
</html>
